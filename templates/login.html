<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("theme");
          if (stored) document.documentElement.setAttribute("data-theme", stored);
        } catch (error) {
          /* localStorage unavailable, default theme stays applied */
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      function withOpacity(variable) {
        return function (helpers) {
          if (helpers.opacityValue !== undefined) return "rgb(var(" + variable + ") / " + helpers.opacityValue + ")";
          return "rgb(var(" + variable + "))";
        };
      }
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              black: withOpacity("--color-black"),
              white: withOpacity("--color-white"),
              zinc: {
                50: withOpacity("--color-zinc-50"),
                100: withOpacity("--color-zinc-100"),
                200: withOpacity("--color-zinc-200"),
                300: withOpacity("--color-zinc-300"),
                400: withOpacity("--color-zinc-400"),
                500: withOpacity("--color-zinc-500"),
                600: withOpacity("--color-zinc-600"),
                700: withOpacity("--color-zinc-700"),
                800: withOpacity("--color-zinc-800"),
                900: withOpacity("--color-zinc-900"),
                950: withOpacity("--color-zinc-950"),
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
    <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}" />
    <meta name="theme-color" content="#5b7cfa" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{{ title }}</title>
  </head>
  <body class="min-h-screen text-zinc-100">
    <div id="bg"></div>
    <div class="absolute right-4 top-4">
      <div class="theme-switch" role="group" aria-label="App theme">
        <button type="button" data-theme-btn="light" aria-pressed="true" title="Light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>
        </button>
        <button type="button" data-theme-btn="dark" aria-pressed="false" title="Dim dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg>
        </button>
        <button type="button" data-theme-btn="amoled" aria-pressed="false" title="AMOLED black">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="8" /></svg>
        </button>
      </div>
    </div>
    <main class="relative flex min-h-screen items-center justify-center px-4">
      <form
        method="post"
        class="w-full max-w-sm rounded-2xl border border-zinc-800 bg-black/60 p-6 shadow-xl backdrop-blur"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="flex items-center gap-3">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </span>
          <div>
            <h1 class="text-xl font-semibold">Music Player</h1>
            <p class="text-xs text-zinc-500">Sign in to stream your library.</p>
          </div>
        </div>

        {% if error %}
          <div class="mt-4 rounded-xl border border-red-900 bg-red-950/40 px-3 py-2 text-sm text-red-100">
            {{ error }}
          </div>
        {% endif %}

        <label class="mt-5 block text-sm text-zinc-400" for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          autofocus
          class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2 outline-none focus:border-zinc-300"
        />

        <label class="mt-4 block text-sm text-zinc-400" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2 outline-none focus:border-zinc-300"
        />

        <button
          type="submit"
          class="mt-6 w-full rounded-xl px-4 py-2 font-semibold text-white"
          style="background: var(--accent);"
        >
          Sign in
        </button>
      </form>
    </main>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
  </body>
</html>
